name: Bug report
description: Something in Nori misbehaves
body:
  - type: input
    id: version
    attributes:
      label: Nori version and macOS version
      placeholder: "Nori 0.1.0 · macOS 26.5"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
  - type: input
    id: app
    attributes:
      label: App you copied from / pasted into (if relevant)
